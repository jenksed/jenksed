<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="profile-title profile-description">
  <title id="profile-title">Joshua Jenks: technical support and support engineering</title>
  <desc id="profile-description">A restrained technical diagram showing Joshua Jenks as the human in the loop between listening, diagnosis, ownership, and verification.</desc>

  <rect width="960" height="260" rx="20" fill="#18211F"/>
  <path d="M48 220H912" stroke="#31403C" stroke-width="1"/>
  <path d="M48 38H912" stroke="#31403C" stroke-width="1"/>

  <text x="56" y="76" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700" letter-spacing="2">JOSHUA JENKS</text>
  <text x="56" y="110" fill="#B7C8B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.4">TECHNICAL SUPPORT / SUPPORT ENGINEERING</text>
  <text x="56" y="164" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">I TROUBLESHOOT THE PROBLEMS THAT MAKE IT</text>
  <text x="56" y="184" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">PAST THE OBVIOUS FIXES.</text>

  <path d="M596 130H652M748 130H804M700 80V108M700 152V180" stroke="#687A70" stroke-width="1.5"/>
  <circle cx="700" cy="130" r="31" fill="#E3A08F"/>
  <circle cx="700" cy="130" r="5" fill="#18211F"/>
  <text x="700" y="134" text-anchor="middle" fill="#18211F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1">HUMAN</text>

  <rect x="508" y="52" width="130" height="36" rx="7" fill="#202F2A" stroke="#506158"/>
  <rect x="762" y="52" width="130" height="36" rx="7" fill="#202F2A" stroke="#506158"/>
  <rect x="508" y="180" width="130" height="36" rx="7" fill="#202F2A" stroke="#506158"/>
  <rect x="762" y="180" width="130" height="36" rx="7" fill="#202F2A" stroke="#506158"/>

  <text x="573" y="75" text-anchor="middle" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">LISTEN</text>
  <text x="827" y="75" text-anchor="middle" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">DIAGNOSE</text>
  <text x="573" y="203" text-anchor="middle" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">OWN</text>
  <text x="827" y="203" text-anchor="middle" fill="#F6F0E7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFY</text>

  <text x="700" y="248" text-anchor="middle" fill="#B1BEB5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6">HUMAN IN THE LOOP</text>
</svg>
